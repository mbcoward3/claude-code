# Example consumer configuration. Copy the relevant bits into your repo's
# .golangci.yml, then lint with the custom binary built via `golangci-lint
# custom` (see .custom-gcl.yml):
#
#   ./bin/custom-gcl run ./...
#   ./bin/custom-gcl run --fix ./...    # auto-wrap offenders
version: "2"

linters:
  enable:
    - errbracket

  settings:
    custom:
      errbracket:
        type: module
        description: Enforce bracketed format verbs inside Errorf-like calls, e.g. [%s].
        # `settings` is optional. Omit it entirely to get the defaults:
        #   verbs: ["s"], functions: [{ name: "fmt.Errorf", formatArg: 0 }]
        settings:
          # Format verbs (single letters, with or without a leading %) that
          # must be bracketed.
          verbs:
            - s
          # Errorf-like functions to inspect. `name` is the import path plus
          # the function name; `formatArg` is the zero-based index of the
          # format string.
          functions:
            - name: fmt.Errorf
              formatArg: 0
            # Uncomment to also cover github.com/pkg/errors wrappers:
            # - name: github.com/pkg/errors.Wrapf
            #   formatArg: 1
            # - name: github.com/pkg/errors.Errorf
            #   formatArg: 0
